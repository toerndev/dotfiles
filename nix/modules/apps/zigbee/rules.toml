# Rules for the zigbee-lamps service.
#
# Saving this file is enough: the service reloads it within ~2s and re-applies
# the current phase to lamps that are on. No restart, no nixos-rebuild. A bad
# edit is logged and the previous rules stay in force.
#
#   lampctl check                   # validate, and show what each lamp does when
#   journalctl -u zigbee-lamps -f   # watch edits take effect
#
# Adding lights and sensors: README.md in this directory.

[defaults]
min_brightness = 15     # = level 30, the drivers' power-on level. The floor: the
                        # dimmest a lamp shows while on, written "min" below.
                        # `lampctl startup --safe-floor` writes it to a driver.
power_on_fade = "1s"    # how fast a lamp that just turned on moves to its phase
reconcile_fade = "3s"   # correcting a lamp found wrong when read live

# ---------------------------------------------------------------------------
# Phases of the day, shared by every lamp. Each runs from `at` until the next
# one; the last wraps past midnight.
#
#   brightness  percent, or "min" for each lamp's min_brightness. 0.4 = level 1
#               of 254, the lowest a driver goes while on.
#   kelvin      2222 warmest .. 5000 coldest: every driver is NFC-set to 200-450
#               mireds, the LEDs' real 2200-5000K. z2m only knows the model's
#               160-450, so don't go above 5000 here; a lamp with a narrower
#               range gets min_kelvin/max_kelvin below.
#   fade        optional. At the phase start, lamps that are on fade to whatever
#               changed, over this long (max 1h49m). Without it, the phase only
#               applies when a lamp turns on -- which is why nothing happens at
#               06:00 to a lamp left on overnight.
# ---------------------------------------------------------------------------

[[phase]]
name = "day"
at = "06:00"
brightness = 100
kelvin = 5000

[[phase]]
name = "evening"
at = "16:30"
brightness = 100
kelvin = 2222
fade = "30m"

[[phase]]
name = "night"
at = "20:00"
brightness = 50
kelvin = 2222
fade = "30m"

[[phase]]
name = "late"
at = "21:30"
brightness = "min"      # level 1 was too dim to tell on from off
kelvin = 2222
fade = "30m"

# ---------------------------------------------------------------------------
# Programs: what a lamp does when an input lights it. Reusable; a lamp picks
# one with `program`, and can pick another for one phase with
# `<phase>.program`.
#
#   brightness = "phase"    while an input holds it: percent, "phase" (the
#                           lamp's look for the current phase) or "min" (its
#                           min_brightness). Colour is always the phase's.
#   after = [ ... ]         once every input has let go, in order:
#                             { hold = "3m" }             stay where it is
#                             { fade = "2m", to = 10 }    percent or "min"; 0 = off
#                           The last level stays until the next input.
#
# The phase is the ceiling: a program level above the lamp's phase look shows
# the phase look instead, and follows the phase's fades (night holds 50% even
# where a program says 100). So programs set the timing; phases the brightness.
#
# An input that comes back during `after` starts again from `brightness`.
# Occupancy sensors only let go after their own timeout (SNZB-03PR2: ~5-15s
# after the last motion report, README), so a first step of
# { hold = "1m" } or so keeps a lamp up for someone walking back and forth.
# ---------------------------------------------------------------------------

[program.motion]        # the PIR holds ~1m after the last movement
brightness = 100
after = [
  { hold = "30s" },
  { fade = "0s", to = 50 },
  { fade = "5m", to = "min" },
  { hold = "5m" },
  { fade = "0s", to = 0 },
]

[program.driveway]      # outdoors: full light while there's motion, then off
brightness = 100
after = [
  { hold = "1m" },
  { fade = "30s", to = 0 },
]

[program.motion-late]   # 21:30-06:00
brightness = "min"
after = [
  { hold = "5m" },
  { fade = "0s", to = 0 },
]

# ---------------------------------------------------------------------------
# One [lamp.<z2m name>] per managed light. Lights not listed are left alone.
# Every key is optional.
#
#   min_brightness, max_brightness      percent, clamp every phase look.
#                                       min_brightness is also what "min"
#                                       means; default: [defaults]
#   min_kelvin, max_kelvin              the range this lamp is set to, when
#                                       narrower than z2m says (NFC-configured)
#   <phase>.brightness, <phase>.kelvin  override one phase for this lamp
#   sensors = ["name", ...]             z2m names of occupancy sensors; any of
#                                       them holds the lamp on. A sensor can be
#                                       listed by several lamps.
#   program = "name"                    see Programs above; needed with sensors
#   <phase>.program = "name"            a different program in that phase
#
# A lamp with a program also runs it when it is switched on (wall, Zigbee,
# power back): lit to the phase look, then `after` as if an input let go.
# ---------------------------------------------------------------------------

[lamp.driveway]         # Hue White A60 E27: dimmable, no colour temperature
sensors = ["driveway-pir"]
program = "driveway"
night.brightness = 100  # outdoors, dark-gated: full brightness whatever the
late.brightness = 100   # hour (the phase is the program's ceiling)

[lamp.bedroom-ceiling]
min_brightness = 30     # no sensor, stays on: never dimmer than 30%

[lamp.stairs-bottom]
sensors = ["stairs-bottom-pir"]
program = "motion"
late.program = "motion-late"

[lamp.hallway]
sensors = ["hallway-pir"]
program = "motion"
late.program = "motion-late"

# ---------------------------------------------------------------------------
# Per-sensor settings, optional. A [sensor.<z2m name>] must be listed in some
# lamp's `sensors`.
#
#   max_lux = 40        motion only lights a lamp that is off while the
#                       sensor's last illuminance is at or below this. A lamp
#                       already on ignores it (it lights up its own sensor).
#                       No reading yet: lights. Hue's bridge calls < ~40 lx
#                       dark; check `lampctl state <sensor>` at dusk on site.
# ---------------------------------------------------------------------------

[sensor.driveway-pir]   # Hue outdoor: occupancy_timeout 30s, sensitivity medium
max_lux = 40
